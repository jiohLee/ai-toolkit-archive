<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>검토 의견서</title>
<style>
  :root {
    --primary: #0066cc;
    --primary-focus: #0071e3;
    --primary-on-dark: #2997ff;
    --ink: #1d1d1f;
    --ink-muted-80: #333333;
    --ink-muted-48: #7a7a7a;
    --body-muted: #cccccc;
    --divider-soft: #f0f0f0;
    --hairline: #e0e0e0;
    --canvas: #ffffff;
    --parchment: #f5f5f7;
    --pearl: #fafafc;
    --tile: #272729;
    --on-dark: #ffffff;
    --minus-bg: #fdecec;
    --plus-bg: #e9f6ee;
    --font: system-ui, -apple-system, "SF Pro Text", "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --mono: ui-monospace, "SF Mono", Consolas, "D2Coding", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: var(--font);
    font-size: 17px;
    line-height: 1.47;
    letter-spacing: -0.374px;
    color: var(--ink);
    background: var(--canvas);
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, p { margin: 0; }

  /* 버튼 */
  button { font-family: inherit; cursor: pointer; border: 0; transition: transform 0.1s; }
  button:active { transform: scale(0.95); }
  button:disabled { cursor: default; opacity: 0.4; transform: none; }
  button:focus-visible, textarea:focus-visible, .seg input:focus-visible + span {
    outline: 2px solid var(--primary-focus);
    outline-offset: 2px;
  }
  .btn-primary {
    background: var(--primary); color: #fff;
    font-size: 14px; letter-spacing: -0.224px;
    padding: 8px 16px; border-radius: 9999px;
  }
  .btn-primary.large { font-size: 17px; letter-spacing: -0.374px; padding: 11px 22px; }
  .btn-pearl {
    background: var(--pearl); color: var(--ink-muted-80);
    font-size: 14px; letter-spacing: -0.224px;
    padding: 6px 12px; border-radius: 11px; border: 3px solid var(--divider-soft);
  }
  .btn-link {
    background: none; color: var(--primary); padding: 4px 0;
    font-size: 14px; letter-spacing: -0.224px;
  }

  /* 내비게이션 */
  .sub-nav {
    position: sticky; top: 0; z-index: 10;
    min-height: 52px; padding: 8px 24px;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
    background: rgba(255, 255, 255, 0.8);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid rgba(0, 0, 0, 0.08);
  }
  .sub-nav .name { font-size: 21px; font-weight: 600; letter-spacing: 0.231px; }
  .center { justify-self: center; display: flex; gap: 12px; align-items: center; min-width: 0; }
  .center .path {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0; color: var(--ink-muted-48);
    max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left;
    user-select: all;
  }
  .center .state { font-size: 12px; letter-spacing: -0.12px; color: var(--ink-muted-80); white-space: nowrap; }
  .actions { justify-self: end; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  /* 타일 */
  .tile { padding: 80px 24px; }
  .tile.dark { background: var(--tile); color: var(--on-dark); }
  .wrap { max-width: 980px; margin: 0 auto; }
  .section-title { font-size: 40px; font-weight: 600; line-height: 1.1; margin-bottom: 32px; }


  /* 통계 카드 */
  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; margin-top: 48px; }
  .stat { background: var(--canvas); border: 1px solid var(--hairline); border-radius: 18px; padding: 24px; }
  .stat .num { font-size: 40px; font-weight: 600; line-height: 1.1; }
  .stat .label { font-size: 14px; color: var(--ink-muted-48); letter-spacing: -0.224px; margin-top: 4px; }

  /* 오류 */
  .errors { margin-top: 32px; background: var(--canvas); border: 1px solid #f2c4c4; border-radius: 18px; padding: 24px; }
  .errors h3 { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
  .errors ul { margin: 0; padding-left: 20px; font-size: 14px; letter-spacing: -0.224px; }

  /* 종합 의견(마크다운) */
  .md { color: var(--body-muted); }
  .md h2, .md h3, .md h4 { color: var(--on-dark); font-weight: 600; margin: 32px 0 12px; }
  .md h2 { font-size: 28px; } .md h3 { font-size: 21px; } .md h4 { font-size: 17px; }
  .md > :first-child { margin-top: 0; }
  .md p { margin: 12px 0; }
  .md ul, .md ol { margin: 12px 0; padding-left: 24px; }
  .md li { margin: 4px 0; }
  .md strong { color: var(--on-dark); font-weight: 600; }
  .md code { font-family: var(--mono); font-size: 15px; background: rgba(255, 255, 255, 0.08); padding: 1px 6px; border-radius: 5px; }

  /* 검토 개요: 검토 대상, 검토 통계, 종합 의견 */
  .ov-block + .ov-block { margin-top: 48px; padding-top: 48px; border-top: 1px solid rgba(255, 255, 255, 0.12); }
  .ov-heading { font-size: 21px; font-weight: 600; letter-spacing: 0.231px; line-height: 1.19; color: var(--on-dark); margin-bottom: 16px; }
  .target-quote {
    margin: 0; padding: 16px 20px;
    display: grid; grid-template-columns: auto 1fr auto; gap: 8px 16px; align-items: baseline;
    background: rgba(255, 255, 255, 0.06);
    border-left: 3px solid rgba(255, 255, 255, 0.32); border-radius: 0 11px 11px 0;
  }
  .target-quote dt { font-size: 14px; color: var(--body-muted); letter-spacing: -0.224px; }
  .target-quote dd { margin: 0; color: var(--on-dark); word-break: break-all; }
  .target-quote dd.path { font-family: var(--mono); font-size: 14px; letter-spacing: 0; }
  .btn-copy { background: none; color: var(--primary-on-dark); font-size: 14px; letter-spacing: -0.224px; padding: 0; }
  .ov-status { font-size: 17px; font-weight: 400; letter-spacing: -0.374px; line-height: 1.47; color: var(--on-dark); }
  .ov-status.done { color: var(--primary-on-dark); }
  .tile.dark .stats { margin-top: 24px; }
  .tile.dark .stat { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12); }
  .tile.dark .stat .label { color: var(--body-muted); }
  .tile.dark .errors { color: var(--ink); }

  /* 필터 */
  .filters { display: flex; flex-wrap: wrap; gap: 24px; margin-bottom: 32px; }
  .filter-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .filter-group .flabel { font-size: 14px; color: var(--ink-muted-48); margin-right: 4px; }
  .chip {
    background: var(--canvas); color: var(--ink);
    border: 1px solid var(--hairline); border-radius: 9999px;
    padding: 7px 15px; font-size: 14px; letter-spacing: -0.224px;
  }
  .chip[aria-pressed="true"] { border: 2px solid var(--primary-focus); padding: 6px 14px; }

  /* 의견 */
  details.group { border-top: 1px solid var(--hairline); padding: 24px 0; }
  details.group > summary {
    list-style: none; cursor: pointer;
    display: flex; align-items: baseline; justify-content: space-between;
    font-size: 21px; font-weight: 600; letter-spacing: 0.231px;
  }
  details.group > summary::-webkit-details-marker { display: none; }
  details.group > summary .count { font-size: 14px; font-weight: 400; color: var(--ink-muted-48); }
  details.group > summary::after { content: "펼치기"; font-size: 14px; font-weight: 400; color: var(--primary); margin-left: 16px; }
  details.group[open] > summary::after { content: "접기"; }
  .card { background: var(--canvas); border: 1px solid var(--hairline); border-radius: 18px; padding: 24px; margin-top: 20px; }
  .card.applied { background: var(--pearl); }
  .card-head { display: flex; gap: 12px; align-items: baseline; }
  .fid { font-size: 14px; color: var(--ink-muted-48); flex: none; }
  .card-title { font-size: 17px; font-weight: 600; line-height: 1.24; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .badge { font-size: 12px; letter-spacing: -0.12px; padding: 4px 10px; border-radius: 9999px; background: var(--parchment); color: var(--ink-muted-80); }
  .badge.required { background: var(--ink); color: #fff; }
  .badge.stage-apply { background: var(--canvas); color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
  .badge.stage-kept { background: var(--hairline); }
  .badge.stage-applied { background: var(--primary); color: #fff; }
  .reason { margin-top: 12px; }
  .rule { margin-top: 4px; font-size: 14px; color: var(--ink-muted-48); letter-spacing: -0.224px; }
  .diff { margin-top: 16px; border: 1px solid var(--divider-soft); border-radius: 8px; overflow: hidden; font-family: var(--mono); font-size: 14px; letter-spacing: 0; }
  .diff div { padding: 6px 12px; white-space: pre-wrap; word-break: break-word; }
  .diff .minus { background: var(--minus-bg); }
  .diff .plus { background: var(--plus-bg); }
  .quote { margin: 16px 0 0; padding: 4px 0 4px 16px; border-left: 3px solid var(--hairline); color: var(--ink-muted-80); }
  .controls { display: flex; gap: 16px; align-items: center; margin-top: 20px; flex-wrap: wrap; }
  .seg { display: inline-flex; background: var(--parchment); border-radius: 9999px; padding: 4px; }
  .seg label { position: relative; }
  .seg input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .seg span { display: inline-block; padding: 6px 18px; border-radius: 9999px; font-size: 14px; letter-spacing: -0.224px; cursor: pointer; }
  .seg input:checked + span { background: var(--primary); color: #fff; }
  .instr {
    width: 100%; margin-top: 12px; min-height: 44px;
    border: 1px solid rgba(0, 0, 0, 0.08); border-radius: 11px; padding: 10px 14px;
    font: inherit; font-size: 14px; letter-spacing: -0.224px; resize: vertical; color: var(--ink);
  }
  .applied-note { margin-top: 16px; font-size: 14px; color: var(--ink-muted-48); }
  .empty { color: var(--ink-muted-48); }

  /* 바닥글, 알림 */
  .toast {
    position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%);
    background: var(--ink); color: #fff; font-size: 14px; letter-spacing: -0.224px;
    padding: 10px 18px; border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity 0.2s;
    max-width: calc(100% - 32px);
  }
  .toast.show { opacity: 1; }

  @media (max-width: 833px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .section-title { font-size: 34px; }
    .sub-nav { grid-template-columns: 1fr; }
    .center, .actions { justify-self: start; }
    .center .path { max-width: 60vw; }
  }
  @media (max-width: 640px) {
    .tile { padding: 48px 16px; }
    .sub-nav { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>
  <div class="sub-nav">
    <span class="name">검토 의견서</span>
    <div class="center" id="center"></div>
    <div class="actions" id="actions"></div>
  </div>

  <main>
    <section class="tile dark" hidden><div class="wrap" id="overview"></div></section>
    <section class="tile" hidden><div class="wrap" id="comments"></div></section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  // 화면에 보이는 단계. 적용으로 결정해도 writer가 반영하기 전까지 status는 pending이다.
  const STAGE_LABEL = { undecided: '미결정', apply: '적용 예정', kept: '유지', applied: '반영됨' };
  const SEVERITY_LABEL = { required: '필수', optional: '권장' };
  const RESULT_LABEL = { edit: '수정', note: '기타 의견' };
  const REQUIRED_FIELDS = ['id', 'category', 'result', 'title', 'rule', 'reason', 'severity', 'line', 'status'];
  const ALLOWED_FIELDS = new Set([...REQUIRED_FIELDS, 'minus', 'plus', 'quote', 'decision', 'instruction']);
  const ENUMS = {
    result: ['edit', 'note'],
    severity: ['required', 'optional'],
    status: ['pending', 'kept', 'applied'],
    decision: ['apply', 'keep'],
  };
  const COMMENTS_FILE = 'comments.jsonl';

  /* ---------- 페이지 자신의 위치 ---------- */

  function selfFolder() {
    let p = decodeURIComponent(location.pathname);
    const windows = /^\/[A-Za-z]:\//.test(p);
    if (windows) p = p.slice(1).replace(/\//g, '\\');
    const cut = Math.max(p.lastIndexOf('\\'), p.lastIndexOf('/'));
    const path = p.slice(0, cut);
    return { path, name: path.split(/[\\/]/).pop() };
  }
  const SELF = selfFolder();

  // mode: connect(처음 연결) | reconnect(권한 재확인) | connected
  const state = {
    mode: 'connect',
    dir: null,
    storedHandle: null,
    loadedMtime: null,
    comments: [],
    overview: null,
    decisions: {},
    filter: { status: 'all', severity: 'all' },
    collapsed: new Set(),
    errors: [],
  };

  const $ = (sel) => document.querySelector(sel);

  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) {
      if (value === null || value === undefined || value === false) continue;
      if (key === 'class') node.className = value;
      else if (key === 'text') node.textContent = value;
      else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value === true ? '' : value);
    }
    for (const child of children) if (child !== null && child !== undefined) node.append(child);
    return node;
  }

  let toastTimer = null;
  function toast(message) {
    const t = $('#toast');
    t.textContent = message;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
  }

  /* ---------- 폴더 핸들 보관(IndexedDB) ---------- */

  function openDb() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('review-folders', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('handles');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function getStoredHandle() {
    try {
      const db = await openDb();
      return await new Promise((resolve, reject) => {
        const req = db.transaction('handles').objectStore('handles').get(SELF.path);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
    } catch { return null; }
  }
  async function storeHandle(handle) {
    try {
      const db = await openDb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction('handles', 'readwrite');
        tx.objectStore('handles').put(handle, SELF.path);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    } catch { /* 보관하지 못하면 다음에 다시 고르면 된다 */ }
  }

  /* ---------- 폴더 연결, 읽기, 저장 ---------- */

  function copyPath() {
    // 클립보드 쓰기는 사용자 클릭 안에서 시작해야 하므로 기다리지 않고 바로 폴더 선택 창을 연다.
    try {
      navigator.clipboard.writeText(SELF.path)
        .then(() => toast('경로 복사됨'))
        .catch(() => toast('경로 복사 실패'));
    } catch {
      toast('경로 복사 실패');
    }
  }

  async function connect() {
    // 전에 연결한 폴더가 있으면 권한만 다시 받는다.
    if (state.storedHandle) {
      try {
        const permission = await state.storedHandle.requestPermission({ mode: 'readwrite' });
        if (permission === 'granted') {
          state.dir = state.storedHandle;
          await loadFromFolder();
          return;
        }
      } catch { /* 저장해 둔 폴더를 쓸 수 없으면 새로 고른다 */ }
      state.storedHandle = null;
      state.mode = 'connect';
      render();
      toast('저장된 폴더 사용 불가');
      return;
    }

    copyPath();
    let handle;
    try {
      handle = await window.showDirectoryPicker({ id: 'review-folder', mode: 'readwrite' });
    } catch (err) {
      if (err && err.name !== 'AbortError') toast('폴더 열기 실패: ' + err.message);
      return;
    }
    if (handle.name !== SELF.name &&
        !confirm(`폴더 이름 불일치: ${handle.name} / ${SELF.name}\n그래도 연결?`)) return;
    state.dir = handle;
    storeHandle(handle); // 폴더 기억은 기다리지 않는다. 실패해도 다음에 다시 고르면 된다.
    await loadFromFolder();
  }

  async function readText(dir, name) {
    const fh = await dir.getFileHandle(name);
    const file = await fh.getFile();
    return { text: await file.text(), mtime: file.lastModified };
  }

  async function loadFromFolder(message = '불러옴') {
    let comments;
    try {
      comments = await readText(state.dir, COMMENTS_FILE);
    } catch {
      state.mode = 'connect';
      state.dir = null;
      render();
      toast(`${COMMENTS_FILE} 없음`);
      return;
    }
    state.mode = 'connected';
    state.loadedMtime = comments.mtime;
    parseComments(comments.text);
    render();
    toast(`${message}: ${state.dir.name}`);
  }

  async function saveToFolder() {
    if (!state.dir) return;
    try {
      const fh = await state.dir.getFileHandle(COMMENTS_FILE);
      const current = await fh.getFile();
      if (current.lastModified !== state.loadedMtime) {
        toast(`${COMMENTS_FILE} 변경됨, 다시 읽기 필요`);
        return;
      }
      const writable = await fh.createWritable();
      await writable.write(buildJsonl());
      await writable.close();
      await loadFromFolder('저장됨');
    } catch (err) {
      toast('저장 실패: ' + err.message);
    }
  }

  /* ---------- 데이터 해석 ---------- */

  function validate(items) {
    const errors = [];
    const ids = new Set();
    for (const { line, obj } of items) {
      const at = `${line}행`;
      if (typeof obj !== 'object' || obj === null || Array.isArray(obj)) {
        errors.push(`${at}: 객체 아님`);
        continue;
      }
      for (const key of REQUIRED_FIELDS) if (!(key in obj)) errors.push(`${at}: 필수 필드 없음: ${key}`);
      for (const key of Object.keys(obj)) if (!ALLOWED_FIELDS.has(key)) errors.push(`${at}: 정의되지 않은 필드: ${key}`);
      for (const [key, values] of Object.entries(ENUMS)) {
        if (key in obj && !values.includes(obj[key])) errors.push(`${at}: 허용되지 않는 값: ${key} = ${JSON.stringify(obj[key])}`);
      }
      if ('line' in obj && (!Number.isInteger(obj.line) || obj.line < 1)) errors.push(`${at}: line 값 오류(1 이상의 정수)`);
      if (!Number.isInteger(obj.id) || obj.id < 1) errors.push(`${at}: id 값 오류(1 이상의 정수)`);
      else if (ids.has(obj.id)) errors.push(`${at}: id 중복: ${obj.id}`);
      else ids.add(obj.id);
      if (obj.result === 'edit' && (!Array.isArray(obj.minus) || obj.minus.length === 0 || !Array.isArray(obj.plus))) {
        errors.push(`${at}: 수정 의견의 minus, plus 없음`);
      }
      if (obj.result === 'note' && !(typeof obj.quote === 'string' && obj.quote)) {
        errors.push(`${at}: 기타 의견의 quote 없음`);
      }
      if (obj.severity === 'required' && !(typeof obj.rule === 'string' && obj.rule.trim())) {
        errors.push(`${at}: 필수 의견의 rule 없음`);
      }
    }
    return errors;
  }

  function isOverview(obj) {
    return obj && typeof obj === 'object' && !Array.isArray(obj) && !('id' in obj) && ('target' in obj || 'content' in obj);
  }

  function validateOverview(line, obj) {
    const errors = [];
    const at = `${line}행(overview)`;
    for (const key of ['target', 'content']) {
      if (typeof obj[key] !== 'string') errors.push(`${at}: 문자열 필드 없음: ${key}`);
    }
    for (const key of Object.keys(obj)) {
      if (key !== 'target' && key !== 'content') errors.push(`${at}: 정의되지 않은 필드: ${key}`);
    }
    return errors;
  }

  // comments.jsonl의 첫 줄은 overview({target, content})이고, 둘째 줄부터 의견이다.
  function parseComments(text) {
    const items = [];
    const errors = [];
    text.split(/\r?\n/).forEach((line, i) => {
      if (!line.trim()) return;
      try { items.push({ line: i + 1, obj: JSON.parse(line) }); }
      catch { errors.push(`${i + 1}행: JSON 형식 오류`); }
    });
    state.overviewRaw = null;
    state.overview = null;
    if (items.length && isOverview(items[0].obj)) {
      const { line, obj } = items.shift();
      errors.push(...validateOverview(line, obj));
      state.overviewRaw = obj;
      state.overview = {
        target: typeof obj.target === 'string' ? obj.target : '',
        body: typeof obj.content === 'string' ? obj.content : '',
      };
    } else {
      errors.push('1행: overview 없음');
    }
    errors.push(...validate(items));
    state.errors = errors;
    state.comments = items.map((x) => x.obj)
      .filter((o) => o && typeof o === 'object' && !Array.isArray(o) && Number.isInteger(o.id));
    state.decisions = {};
    for (const f of state.comments) {
      if (f.decision || f.instruction) state.decisions[f.id] = { decision: f.decision || null, instruction: f.instruction || '' };
    }
  }

  function buildJsonl() {
    const overviewLine = state.overviewRaw ? [JSON.stringify(state.overviewRaw)] : [];
    return overviewLine.concat(state.comments.map((f) => {
      const out = { ...f };
      if (f.status !== 'applied') {
        const d = state.decisions[f.id];
        delete out.decision;
        delete out.instruction;
        if (d && d.decision) out.decision = d.decision;
        if (d && d.instruction && d.instruction.trim()) out.instruction = d.instruction.trim();
        out.status = d && d.decision === 'keep' ? 'kept' : 'pending';
      }
      return JSON.stringify(out);
    })).join('\n') + '\n';
  }

  /* ---------- 마크다운 ---------- */

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function inlineMd(s) {
    return escapeHtml(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  }
  function renderMarkdown(text) {
    const out = [];
    let para = [];
    let list = null;
    const flushPara = () => { if (para.length) { out.push('<p>' + inlineMd(para.join(' ')) + '</p>'); para = []; } };
    const flushList = () => {
      if (!list) return;
      out.push(`<${list.tag}>` + list.items.map((i) => '<li>' + inlineMd(i) + '</li>').join('') + `</${list.tag}>`);
      list = null;
    };
    for (const raw of text.split(/\r?\n/)) {
      const line = raw.replace(/\s+$/, '');
      let m;
      if (!line.trim()) { flushPara(); flushList(); continue; }
      if ((m = line.match(/^(#{1,4})\s+(.*)$/))) {
        flushPara(); flushList();
        const level = Math.min(m[1].length + 1, 4);
        out.push(`<h${level}>${inlineMd(m[2])}</h${level}>`);
        continue;
      }
      if ((m = line.match(/^\s*[-*]\s+(.*)$/))) {
        flushPara();
        if (!list || list.tag !== 'ul') { flushList(); list = { tag: 'ul', items: [] }; }
        list.items.push(m[1]);
        continue;
      }
      if ((m = line.match(/^\s*\d+\.\s+(.*)$/))) {
        flushPara();
        if (!list || list.tag !== 'ol') { flushList(); list = { tag: 'ol', items: [] }; }
        list.items.push(m[1]);
        continue;
      }
      flushList();
      para.push(line.trim());
    }
    flushPara(); flushList();
    return out.join('\n');
  }

  /* ---------- 상태와 통계(페이지에서 계산) ---------- */

  function stageOf(f) {
    if (f.status === 'applied') return 'applied';
    const d = state.decisions[f.id];
    if (d && d.decision === 'apply') return 'apply';
    if (d && d.decision === 'keep') return 'kept';
    return 'undecided';
  }

  function statusOf(f) {
    if (f.status === 'applied') return 'applied';
    const d = state.decisions[f.id];
    if (d && d.decision === 'keep') return 'kept';
    return 'pending';
  }

  function computeStats() {
    const s = { total: 0, required: 0, optional: 0, decided: 0, applied: 0, requiredPending: 0 };
    for (const f of state.comments) {
      s.total++;
      if (f.severity === 'required') s.required++; else s.optional++;
      const st = statusOf(f);
      const d = state.decisions[f.id];
      if (st === 'applied') s.applied++;
      if (st === 'applied' || (d && d.decision)) s.decided++;
      if (f.severity === 'required' && st === 'pending') s.requiredPending++;
    }
    return s;
  }

  /* ---------- 화면 ---------- */

  function render() {
    renderNav();
    renderOverview();
    renderComments();
  }

  // 화면에는 구분자를 /로 표시한다. 복사하는 경로는 운영체제 형식을 유지한다.
  const DISPLAY_PATH = SELF.path.replace(/\\/g, '/');

  function pathLabel(text) {
    return el('span', { class: 'path', title: text }, el('bdi', { dir: 'ltr', text }));
  }

  // target이 상대 경로이면 이 페이지의 폴더를 기준으로 풀어 /로 구분한 절대 경로를 만든다.
  function resolvePath(base, rel) {
    const p = rel.replace(/\\/g, '/');
    if (/^([A-Za-z]:)?\//.test(p)) return p;
    const parts = base.split('/');
    for (const seg of p.split('/')) {
      if (seg === '' || seg === '.') continue;
      if (seg === '..') { if (parts.length > 1) parts.pop(); } else parts.push(seg);
    }
    return parts.join('/');
  }

  function copyText(text, button) {
    const done = (label) => {
      button.textContent = label;
      setTimeout(() => { button.textContent = '복사'; }, 1500);
    };
    try {
      navigator.clipboard.writeText(text).then(() => done('복사함'), () => done('복사 실패'));
    } catch {
      done('복사 실패');
    }
  }

  function hasData() {
    return state.comments.length > 0 || !!state.overview || state.errors.length > 0;
  }

  function renderNav() {
    const center = $('#center');
    const actions = $('#actions');
    center.replaceChildren();
    actions.replaceChildren();
    if (state.mode === 'connected') {
      center.append(el('span', { class: 'state', text: '경로:' }), pathLabel(`${DISPLAY_PATH}/${COMMENTS_FILE}`));
      actions.append(
        el('button', { class: 'btn-pearl', type: 'button', text: '다시 읽기', onclick: () => loadFromFolder('다시 읽음') }),
        el('button', { class: 'btn-primary', type: 'button', text: '결정 저장', onclick: saveToFolder }),
      );
    } else {
      center.append(pathLabel(`${DISPLAY_PATH}/${COMMENTS_FILE}`), el('button', { class: 'btn-primary', type: 'button', text: '연결하기', onclick: connect }));
    }
  }

  function renderOverview() {
    const box = $('#overview');
    box.replaceChildren(el('h2', { class: 'section-title', text: '검토 개요' }));
    box.closest('section').hidden = !hasData(); // 읽은 데이터가 없으면 영역을 숨긴다.
    if (!hasData()) return;

    // 검토 대상
    const target = state.overview && state.overview.target;
    const targetPath = target ? resolvePath(DISPLAY_PATH, target) : '';
    const targetDir = targetPath.slice(0, targetPath.lastIndexOf('/')); // 경로는 원고가 있는 폴더까지만 표시한다.
    const copy = el('button', { class: 'btn-copy', type: 'button', text: '복사' });
    copy.addEventListener('click', () => copyText(targetDir, copy));
    box.append(el('div', { class: 'ov-block' },
      el('h3', { class: 'ov-heading', text: '검토 대상' }),
      el('dl', { class: 'target-quote' },
        el('dt', { text: '문서' }), el('dd', { text: target ? targetPath.split('/').pop() : '-' }), el('span'),
        el('dt', { text: '경로' }), el('dd', { class: 'path', text: targetDir || '-' }), target ? copy : el('span'),
      ),
    ));

    // 검토 통계(페이지에서 계산)
    if (state.comments.length || state.errors.length) {
      const block = el('div', { class: 'ov-block' }, el('h3', { class: 'ov-heading', text: '검토 통계' }));
      if (state.comments.length) {
        const s = computeStats();
        const done = s.requiredPending === 0;
        const stat = (num, label) => el('div', { class: 'stat' }, el('div', { class: 'num', text: String(num) }), el('div', { class: 'label', text: label }));
        block.append(
          el('p', {
            class: 'ov-status' + (done ? ' done' : ''),
            text: done ? '검토 완료: 대기 중인 필수 의견 없음' : `대기 중인 필수 의견 ${s.requiredPending}건`,
          }),
          el('div', { class: 'stats' },
            stat(s.total, '전체 의견'),
            stat(s.required, '필수'),
            stat(s.optional, '권장'),
            stat(`${s.decided}/${s.total}`, '결정'),
            stat(s.applied, '반영'),
          ),
        );
      }
      if (state.errors.length) {
        const list = el('ul');
        for (const e of state.errors) list.append(el('li', { text: e }));
        block.append(el('div', { class: 'errors' }, el('h3', { text: `형식 오류 ${state.errors.length}건` }), list));
      }
      box.append(block);
    }

    // 종합 의견(overview의 content)
    if (state.overview && state.overview.body.trim()) {
      const md = el('div', { class: 'md' });
      md.innerHTML = renderMarkdown(state.overview.body); // 원문은 escapeHtml을 거친다.
      box.append(el('div', { class: 'ov-block' }, md));
    }
  }

  function chip(label, pressed, onClick) {
    return el('button', { class: 'chip', type: 'button', 'aria-pressed': pressed ? 'true' : 'false', text: label, onclick: onClick });
  }

  function renderComments() {
    const box = $('#comments');
    box.replaceChildren(el('h2', { class: 'section-title', text: '검토 의견' }));
    box.closest('section').hidden = false;
    if (!state.comments.length) {
      box.closest('section').hidden = true;
      return;
    }

    const statusGroup = el('div', { class: 'filter-group' }, el('span', { class: 'flabel', text: '상태' }));
    for (const [v, label] of [['all', '전체'], ['undecided', '미결정'], ['apply', '적용 예정'], ['kept', '유지'], ['applied', '반영됨']]) {
      statusGroup.append(chip(label, state.filter.status === v, () => { state.filter.status = v; renderComments(); }));
    }
    const sevGroup = el('div', { class: 'filter-group' }, el('span', { class: 'flabel', text: '등급' }));
    for (const [v, label] of [['all', '전체'], ['required', '필수'], ['optional', '권장']]) {
      sevGroup.append(chip(label, state.filter.severity === v, () => { state.filter.severity = v; renderComments(); }));
    }
    box.append(el('div', { class: 'filters' }, statusGroup, sevGroup));

    const visible = state.comments.filter((f) =>
      (state.filter.status === 'all' || stageOf(f) === state.filter.status) &&
      (state.filter.severity === 'all' || f.severity === state.filter.severity));
    if (!visible.length) {
      box.append(el('p', { class: 'empty', text: '조건에 맞는 의견 없음' }));
      return;
    }

    const groups = new Map();
    for (const f of visible) {
      const key = f.category || '분류 없음';
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(f);
    }
    for (const [category, items] of groups) {
      const details = el('details', { class: 'group', open: !state.collapsed.has(category) });
      details.addEventListener('toggle', () => {
        if (details.open) state.collapsed.delete(category); else state.collapsed.add(category);
      });
      details.append(el('summary', {}, el('span', {}, category + ' ', el('span', { class: 'count', text: `${items.length}건` }))));
      for (const f of items) details.append(card(f));
      box.append(details);
    }
  }

  function card(f) {
    const st = statusOf(f);
    const d = state.decisions[f.id] || { decision: null, instruction: '' };
    const node = el('article', { class: 'card' + (st === 'applied' ? ' applied' : ''), id: 'f-' + f.id });
    node.append(
      el('div', { class: 'card-head' }, el('span', { class: 'fid', text: '#' + f.id }), el('h3', { class: 'card-title', text: f.title })),
      el('div', { class: 'badges' },
        el('span', { class: 'badge ' + f.severity, text: SEVERITY_LABEL[f.severity] || f.severity }),
        el('span', { class: 'badge', text: RESULT_LABEL[f.result] || f.result }),
        el('span', { class: 'badge stage-' + stageOf(f), text: STAGE_LABEL[stageOf(f)] }),
      ),
      el('p', { class: 'reason', text: f.reason }),
    );
    if (Number.isInteger(f.line)) node.append(el('p', { class: 'rule', text: `위치: ${f.line}행` }));
    if (f.rule) node.append(el('p', { class: 'rule', text: '근거: ' + f.rule }));
    if (f.result === 'edit') {
      const diff = el('div', { class: 'diff' });
      for (const line of f.minus || []) diff.append(el('div', { class: 'minus', text: '- ' + line }));
      for (const line of f.plus || []) diff.append(el('div', { class: 'plus', text: '+ ' + line }));
      node.append(diff);
    } else if (f.quote) {
      node.append(el('blockquote', { class: 'quote', text: f.quote }));
    }

    if (st === 'applied') {
      node.append(el('p', { class: 'applied-note', text: '원고에 반영됨' }));
      return node;
    }

    const seg = el('div', { class: 'seg', role: 'radiogroup', 'aria-label': `#${f.id} 결정` });
    for (const [value, label] of [['apply', '적용'], ['keep', '유지']]) {
      const input = el('input', {
        type: 'radio', name: 'decision-' + f.id, value, checked: d.decision === value,
        onchange: () => setDecision(f.id, value),
      });
      seg.append(el('label', {}, input, el('span', { text: label })));
    }
    const clear = el('button', { class: 'btn-link', type: 'button', text: '선택 해제', onclick: () => setDecision(f.id, null) });
    const instr = el('textarea', {
      class: 'instr', rows: '1', placeholder: '기타 지시(선택)', 'aria-label': `#${f.id} 기타 지시`,
      oninput: (e) => setInstruction(f.id, e.target.value),
    });
    instr.value = d.instruction || '';
    node.append(el('div', { class: 'controls' }, seg, clear), instr);
    return node;
  }

  function setDecision(id, decision) {
    const prev = state.decisions[id] || { instruction: '' };
    state.decisions[id] = { ...prev, decision };
    renderOverview();
    renderComments();
  }

  function setInstruction(id, instruction) {
    const prev = state.decisions[id] || { decision: null };
    state.decisions[id] = { ...prev, instruction };
  }

  /* ---------- 시작 ---------- */

  function withTimeout(promise, ms) {
    return Promise.race([promise, new Promise((resolve) => setTimeout(() => resolve(null), ms))]);
  }

  async function init() {
    render(); // 저장된 폴더를 조회하는 동안에도 연결 화면을 먼저 보여 준다.
    const handle = await withTimeout(getStoredHandle(), 2000);
    if (handle) {
      state.storedHandle = handle;
      let permission = 'prompt';
      try { permission = await handle.queryPermission({ mode: 'readwrite' }); } catch { /* 권한 확인 실패 */ }
      if (permission === 'granted') {
        state.dir = handle;
        await loadFromFolder();
        return;
      }
      state.mode = 'reconnect';
    }
    render();
  }

  init();
})();
</script>
</body>
</html>
